# Nginx site config for Pollistics — reverse-proxies one domain to the two
# Node processes (web + api) started by PM2.
#
# Install on the VPS:
#   sudo cp deploy/nginx-pollistics.conf /etc/nginx/sites-available/pollistics
#   sudo ln -s /etc/nginx/sites-available/pollistics /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then issue TLS:  sudo certbot --nginx -d pollistics.com -d www.pollistics.com
#
# NOTE: replace pollistics.com below with your real domain (the banner said
# "pollstics.com" — mind the spelling and point DNS A records at the VPS IP).

upstream pollistics_web { server 127.0.0.1:3004; }
upstream pollistics_api { server 127.0.0.1:9003; }

server {
    listen 80;
    listen [::]:80;
    server_name pollistics.com www.pollistics.com;

    client_max_body_size 25m;   # manuscript / cover uploads

    # API + realtime -> Express (strip nothing; API mounts under /api itself)
    location /api/ {
        proxy_pass http://pollistics_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://pollistics_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://pollistics_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
